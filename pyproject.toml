[project]
name = "fly-in"
version = "0.1.0"
description = "Multi-drone routing simulator: conflict-free path planning over hub graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]>=0.141.1",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "webcolors>=25.10.0",
]


[[tool.mypy.overrides]]
module = "webcolors.*"
ignore_missing_imports = true